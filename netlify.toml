# Netlify build settings for 保羅大富翁 (Vite + PWA).
# Netlify builds from source on its own Linux image, so the Windows/Node 24
# local build quirk does not apply here. NODE_VERSION is pinned to 20 because
# vite-plugin-pwa's Workbox step is unreliable on Node 24.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 0817 搬遷 Cloudflare Pages:舊網址(含已安裝的舊 PWA)全部 301 到新家,留置一個月後關站
[[redirects]]
  from = "/*"
  to = "https://hfpc-paul-game.pages.dev/:splat"
  status = 301
  force = true
