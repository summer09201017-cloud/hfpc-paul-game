<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e86ab" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="保羅之旅" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>保羅宣教之旅</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 手機直向時蓋住畫面,提示轉成橫向(只在觸控裝置的直向顯示;跟約拿引擎同款) -->
    <div id="rotate" class="rotate-hint" aria-hidden="true">
      <div class="rotate-emoji">🔄</div>
      <p>請把手機轉成<b>橫向</b>來玩<br /><span>轉成橫向會自動全螢幕</span></p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  
<script>
// ← 返回大廳(skill back-to-lobby-button):孩子卡住要能離開。DOM 疊在畫面上,不畫進 canvas。
// 退出 ≠ 過關:這裡只導頁,絕不呼叫 onComplete。嵌入時先讓宿主處理。
(function () {
  var LOBBY = 'https://hfpc-bible-games.summer09201017.workers.dev';
  function go() {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    if (window.parent && window.parent !== window) {          // 嵌入:交給宿主收掉關卡視窗
      try { window.parent.postMessage({ type: 'hfpc-exit' }, '*'); } catch (e) {}
      if (history.length > 1) { history.back(); return; }
    }
    location.href = LOBBY;
  }
  function add() {
    if (document.querySelector('[data-hfpc-lobby]')) return;
    var b = document.createElement('button');
    b.textContent = '← 返回大廳';
    b.setAttribute('aria-label', '返回大廳');
    b.setAttribute('data-hfpc-lobby', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;padding:9px 14px;border:0;border-radius:12px;' +
      'font:600 15px/1.2 system-ui,"Microsoft JhengHei",sans-serif;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', go);
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();
</script>
<script>
  // play-stats 三層匿名計數(skill play-stats-lite / play-stats-dwell)。
  // 零個資:無 cookie、無 IP 存檔、無帳號;離線時靜默跳過,不影響遊戲。
  // ⚠ 閘門用「黑名單」只擋本機開發 —— 絕不可寫成 hostname 白名單:
  //    平台白名單=每次搬家都會靜靜斷流,而搬家的人不會想到回來改這一行(0813 大廳/約拿、0815 但以理)。
  window.psPing = function (key, t) {
    try {
      if (['localhost', '127.0.0.1', ''].includes(location.hostname)) return;
      var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
      if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
    } catch (_) {}
  };
  // ① 開啟:10 分鐘內同一台裝置只算一次
  try {
    var psK = 'ps-last-paul';
    var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
    if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('paul'); }
  } catch (_) { window.psPing('paul'); }
  // ② 真實停留:開頁 → 第一次離開回報一發 -dwell 帶秒數。
  //    ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
  (function () {
    var _dwT0 = Date.now(), _dwSent = false;
    function _dwLeave() {
      if (_dwSent) return; _dwSent = true;
      var sec = Math.round((Date.now() - _dwT0) / 1000);
      if (sec < 3 || sec > 1800) return;   // 誤觸不算、掛整天的背景分頁也不算
      window.psPing('paul-dwell', sec);
    }
    addEventListener('pagehide', _dwLeave);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') _dwLeave();
    });
  })();
</script>
</body>
</html>
